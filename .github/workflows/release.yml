name: Release

# Every push to main validates the Terraform code. If the version in VERSION
# has no tag yet, tag v<VERSION> and a GitHub release are created with the
# matching CHANGELOG.md section as release notes. Only versions with a
# pre-release suffix (e.g. 1.2.0-rc.1) are marked as pre-release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.dir }} (${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [proxmox, vcenter, esxi, workstation, libvirt, virtualbox]
        tool: [terraform, tofu]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        if: matrix.tool == 'terraform'

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: matrix.tool == 'tofu'
        with:
          tofu_version: "~1.13.0" # newest published 1.13 patch

      - name: fmt
        run: ${{ matrix.tool }} fmt -check -recursive -diff

      # OpenTofu resolves the providers from its own registry, so it adds its
      # entries to the lock file (in the runner only).
      - name: init
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.tool }} init -backend=false -input=false

      - name: validate
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.tool }} validate

  ansible:
    name: Check Ansible playbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Install ansible-role-kubernetes
        run: |
          version="$(sed -n '/variable "ansible_role_version"/,/^}/s/.*default *= *"\(.*\)"/\1/p' proxmox/variables.tf)"
          printf -- '- name: ansible-role-kubernetes\n  src: https://github.com/636B65/ansible-role-kubernetes.git\n  scm: git\n  version: %s\n' "$version" > requirements.yml
          ansible-galaxy role install -r requirements.yml -p roles

      - name: Syntax check
        env:
          ANSIBLE_ROLES_PATH: roles
        run: |
          printf 'all:\n  children:\n    k8s_control_plane:\n      hosts: { cp: { ansible_host: 192.0.2.1 } }\n    k8s_workers:\n      hosts: { wl: { ansible_host: 192.0.2.2 } }\n' > inventory.yml
          for playbook in ansible/*.yml; do
            ansible-playbook -i inventory.yml --syntax-check "$playbook"
          done

  test:
    name: Test ${{ matrix.module }} (${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [cloud-init, ansible]
        tool: [terraform, tofu]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        if: matrix.tool == 'terraform'

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: matrix.tool == 'tofu'
        with:
          tofu_version: "~1.13.0" # newest published 1.13 patch

      - name: init
        working-directory: modules/${{ matrix.module }}
        run: ${{ matrix.tool }} init -backend=false -input=false

      - name: test
        working-directory: modules/${{ matrix.module }}
        run: ${{ matrix.tool }} test

  lint:
    name: Lint (pre-commit, tflint) and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: tflint --init
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: pre-commit (fmt, tflint, shellcheck, shared files in sync, YAML)
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  release:
    name: Tag and create release
    needs: [validate, ansible, test, lint]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read and check version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error file=VERSION::'$version' is not a valid semver version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # Only semver pre-release versions (e.g. 1.2.0-rc.1) become pre-releases.
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$version already exists - no new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=CHANGELOG.md::No [$VERSION] section in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md

      - name: Create tag and release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --prerelease="$PRERELEASE"

      - name: Fix pre-release status of existing release
        if: steps.version.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          current="$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease 2>/dev/null || echo missing)"
          if [[ "$current" != "missing" && "$current" != "$PRERELEASE" ]]; then
            gh release edit "$TAG" --prerelease="$PRERELEASE"
            echo "Set prerelease=$PRERELEASE on $TAG"
          fi
