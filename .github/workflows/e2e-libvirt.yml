name: E2E (libvirt)

# Deploys real clusters: two Ubuntu 26.04 VMs on KVM/libvirt inside the runner
# (libvirt/), installed with ansible-role-kubernetes (run_ansible). Without
# Longhorn, the registry and Headlamp, so it fits a 4 vCPU / 16 GB runner.
#
#   basic    nightly: both nodes Ready, Cilium and Argo CD (default) running
#   addons   weekly: also Traefik, cert-manager and Velero, with a backup to
#            an S3 server (moto) on the runner
#   offline  weekly: the VMs have no route out; the kit is built with
#            scripts/prepare-offline.sh -f terraform.tfvars and the cluster is
#            installed from its bundle
#   upgrade  weekly: the previous release is deployed, then this commit is
#            applied on top; no VM may be replaced
#
# By hand: choose a scenario, or "all".

on:
  schedule:
    - cron: "23 2 * * *"
    - cron: "47 3 * * 0"
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario
        type: choice
        options: [basic, addons, offline, upgrade, all]
        default: basic
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/e2e-libvirt.yml
      - tests/e2e/**

permissions:
  contents: read

concurrency:
  group: e2e-libvirt-${{ github.ref }}-${{ github.event.inputs.scenario || github.event.schedule || 'push' }}
  cancel-in-progress: true

env:
  IMAGE_BASE: https://cloud-images.ubuntu.com/releases/26.04/release
  IMAGE_NAME: ubuntu-26.04-server-cloudimg-amd64.img

jobs:
  scenarios:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ github.event.inputs.scenario }}
        run: |
          case "$EVENT:$SCHEDULE:$INPUT" in
            schedule:"47 3 * * 0":*) list='["addons","offline","upgrade"]' ;;
            workflow_dispatch::all) list='["basic","addons","offline","upgrade"]' ;;
            workflow_dispatch::*) list="[\"$INPUT\"]" ;;
            *) list='["basic"]' ;;
          esac
          echo "list=$list" >> "$GITHUB_OUTPUT"

  e2e:
    needs: scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.scenarios.outputs.list) }}
    name: e2e (${{ matrix.scenario }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare KVM and libvirt
        timeout-minutes: 25
        env:
          E2E_NETWORK: ${{ matrix.scenario == 'offline' && 'isolated' || 'nat' }}
        run: tests/e2e/libvirt-host.sh

      - name: Look up the image checksum
        id: image
        run: |
          sha="$(curl -fsSL --retry 3 "$IMAGE_BASE/SHA256SUMS" | awk -v f="$IMAGE_NAME" '$2 == f || $2 == "*" f { print $1 }')"
          test -n "$sha"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache the Ubuntu image
        uses: actions/cache@v6
        with:
          path: ~/e2e-image
          key: ubuntu-image-${{ steps.image.outputs.sha256 }}

      - name: Download the Ubuntu image
        env:
          SHA256: ${{ steps.image.outputs.sha256 }}
        run: |
          mkdir -p ~/e2e-image
          if ! echo "$SHA256  $HOME/e2e-image/$IMAGE_NAME" | sha256sum -c --status 2>/dev/null; then
            curl -fL --retry 3 -o ~/e2e-image/"$IMAGE_NAME" "$IMAGE_BASE/$IMAGE_NAME"
            echo "$SHA256  $HOME/e2e-image/$IMAGE_NAME" | sha256sum -c
          fi

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # The libvirt provider is downloaded from its GitHub release, which can be
      # unavailable for hours (504 Gateway Timeout); keep it between runs.
      - name: Use a provider cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Restore the provider cache
        id: providers
        uses: actions/cache/restore@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ hashFiles('*/.terraform.lock.hcl') }}
          restore-keys: terraform-providers-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Check out the previous release
        if: matrix.scenario == 'upgrade'
        id: previous
        run: |
          current="v$(cat VERSION)"
          previous="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$current" | head -n 1)"
          echo "Upgrading from $previous to $(git rev-parse --short HEAD)"
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The scenario scripts of this commit are used for both steps.
          cp -r tests/e2e "$RUNNER_TEMP/e2e"
          git checkout -q "$previous"

      - name: Write terraform.tfvars and prepare the host
        env:
          E2E_IMAGE_SHA256: ${{ steps.image.outputs.sha256 }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          scripts="tests/e2e"
          [[ "$SCENARIO" != upgrade ]] || scripts="$RUNNER_TEMP/e2e"
          bash "$scripts/scenario.sh" tfvars "$SCENARIO"
          bash "$scripts/scenario.sh" prepare "$SCENARIO"

      - name: terraform init
        working-directory: libvirt
        run: |
          # The registry and github.com (provider checksums) sometimes answer 5xx.
          for try in 1 2 3 4; do
            terraform init -input=false && break
            [[ $try -lt 4 ]] || exit 1
            sleep $((try * 20))
          done

      # Saved right after init, so a later failure of the run does not lose it.
      - name: Save the provider cache
        if: steps.providers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ steps.providers.outputs.cache-primary-key }}

      - name: terraform apply (VMs + Kubernetes)
        working-directory: libvirt
        run: terraform apply -auto-approve -input=false

      - name: Upgrade to this commit
        if: matrix.scenario == 'upgrade'
        working-directory: libvirt
        env:
          HEAD_SHA: ${{ steps.previous.outputs.head }}
        run: |
          KUBECONFIG="$(terraform output -raw kubeconfig)" bash "$RUNNER_TEMP/e2e/scenario.sh" check nodes
          git checkout -q "$HEAD_SHA"
          for try in 1 2 3 4; do
            terraform init -input=false -upgrade && break
            [[ $try -lt 4 ]] || exit 1
            sleep $((try * 20))
          done
          terraform plan -input=false -out=upgrade.plan
          bash ../tests/e2e/scenario.sh no-replaced-vms
          terraform apply -input=false upgrade.plan

      - name: Check the cluster
        working-directory: libvirt
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          export KUBECONFIG="$(terraform output -raw kubeconfig)"
          bash ../tests/e2e/scenario.sh check "$SCENARIO"

      - name: Collect diagnostics
        if: failure()
        run: bash tests/e2e/diagnostics.sh kube-cp01=192.168.123.11 kube-wl01=192.168.123.21

      - name: terraform destroy
        if: always()
        working-directory: libvirt
        run: terraform destroy -auto-approve -input=false -no-color 2>&1 | tail -n 5 || true
