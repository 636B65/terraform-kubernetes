version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: terraform
    directories:
      - /proxmox
      - /vcenter
      - /esxi
      - /workstation
      - /libvirt
      - /virtualbox
      - /modules/ansible
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      terraform-providers:
        patterns:
          - "*"
