# pip install pre-commit && pre-commit install
# Needs terraform, tflint and bash on the machine. CI runs the same hooks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: sync-common
        name: Shared platform files are generated from shared/
        entry: scripts/sync-common.sh --check
        language: script
        files: ^(shared/|scripts/sync-common\.sh$|[a-z]+/(variables|common|ansible)\.tf$)
        pass_filenames: false
