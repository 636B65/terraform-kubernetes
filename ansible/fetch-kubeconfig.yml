---
# Fetches the cluster admin kubeconfig from the first controller to the
# machine running Ansible. Its server is the API virtual IP, so it works from
# anywhere that reaches the VIP. Run with -e kubeconfig=/path/to/kubeconfig.

- name: Fetch the admin kubeconfig
  hosts: k8s_control_plane[0]
  gather_facts: false
  become: true
  tasks:
    - name: Fetch /etc/kubernetes/admin.conf
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ kubeconfig }}"
        flat: true

    - name: Restrict the kubeconfig to the current user
      ansible.builtin.file:
        path: "{{ kubeconfig }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      vars:
        ansible_become: false
